<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$JOKER — Welcome to a World Without Rules</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #040405;
      --white-primary: #f8fafc;
      --white-secondary: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--white-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      height: 100svh;
      width: 100vw;
    }

    .film-canvas {
      position: absolute;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background: #000;
    }

    .film-canvas video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
      filter: brightness(0.7) contrast(1.2) grayscale(0.2);
    }

    .film-grade {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(4,4,5,0.98) 0%, rgba(4,4,5,0.85) 30%, rgba(4,4,5,0.15) 65%, rgba(4,4,5,0.4) 100%),
        linear-gradient(180deg, rgba(4,4,5,0.85) 0%, transparent 15%, transparent 80%, rgba(4,4,5,0.95) 100%);
    }

    .stage {
      height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(20px, 4vh, 40px) clamp(24px, 5vw, 80px);
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      font-family: 'Archivo', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--white-primary);
    }

    nav { display: flex; gap: 28px; }

    nav a {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--white-secondary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    nav a:hover { color: var(--white-primary); }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 480px;
    }

    .prologue {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--white-secondary);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prologue::before {
      content: '';
      width: 14px;
      height: 1px;
      background: var(--white-secondary);
    }

    h1 {
      font-family: 'Archivo', sans-serif;
      font-size: clamp(24px, 2.6vw, 36px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 16px;
    }

    h1 span {
      display: block;
      color: var(--white-secondary);
      font-weight: 500;
    }

    .statement {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--white-secondary);
      margin-bottom: 28px;
      max-width: 380px;
    }

    .statement strong {
      color: var(--white-primary);
      font-weight: 500;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .btn-theatrical {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 24px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: #040405;
      background: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 1px;
      transition: all 0.25s ease;
    }

    .btn-theatrical:hover {
      background: transparent;
      color: #ffffff;
    }

    .btn-secondary {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--white-secondary);
      transition: color 0.2s ease;
    }

    .btn-secondary:hover { color: var(--white-primary); }

    footer {
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }

    .credit-tag {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .credit-tag .title {
      font-family: 'Archivo', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white-primary);
    }

    .credit-tag .tagline {
      font-size: 11px;
      color: var(--white-secondary);
      font-style: italic;
    }

    .legal-card {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #52525b;
      text-align: right;
      line-height: 1.4;
      max-width: 360px;
    }

    @media (max-width: 768px) {
      .stage { padding: 20px; }
      .film-canvas video { object-position: 80% center; }
      .film-grade {
        background: linear-gradient(180deg, rgba(4,4,5,0.92) 0%, rgba(4,4,5,0.5) 40%, rgba(4,4,5,0.98) 100%);
      }
      h1 { font-size: 22px; }
      footer { flex-direction: column; align-items: flex-start; }
      .legal-card { text-align: left; }
    }
  </style>
</head>
<body>

  <div class="film-canvas">
    <video autoplay muted loop playsinline preload="auto">
      <source src="joker-loop.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="film-grade"></div>

  <div class="stage">
    <header>
      <div class="brand">$JOKER</div>
      <nav>
        <a href="https://x.com/jokernearly" target="_blank" rel="noopener noreferrer">X ↗</a>
        <a href="https://t.me/+koS3pmJf6_E4ZmJk" target="_blank" rel="noopener noreferrer">Telegram ↗</a>
      </nav>
    </header>

    <main>
      <div class="prologue">Why so bullish?</div>
      <h1>
        Welcome to a world
        <span>Without rules.</span>
      </h1>
      <p class="statement">
        Some men just want to watch<br />
        <strong>the chart burn.</strong>
      </p>
      <div class="button-group">
        <a href="https://t.me/+koS3pmJf6_E4ZmJk" target="_blank" rel="noopener noreferrer" class="btn-theatrical">Join the Asylum ↗</a>
        <a href="https://x.com/jokernearly" target="_blank" rel="noopener noreferrer" class="btn-secondary">X ↗</a>
      </div>
    </main>

    <footer>
      <div class="credit-tag">
        <div class="title">Act I: Opening Scene</div>
        <div class="tagline">“All part of the plan.”</div>
      </div>
      <div class="legal-card">
        NEAR PROTOCOL · $JOKER<br />
        Independent community narrative. Not affiliated with DC Comics or Warner Bros.
      </div>
    </footer>
  </div>

</body>
</html>
